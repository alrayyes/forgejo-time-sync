services:
  forgejo-time-sync:
    build: .
    image: forgejo-time-sync
    restart: unless-stopped
    env_file: .env
    # The two actual credentials come from secrets: below, not env_file —
    # environment:/env_file is readable by any process in the container
    # and shows up in `docker inspect` and logs, a secrets: file is not.
    # The app reads a *_FILE-suffixed env var pointing at the mounted
    # secret in preference to the plain one (internal/config).
    environment:
      FORGEJO_TOKEN_FILE: /run/secrets/forgejo_token
      TOGGL_API_TOKEN_FILE: /run/secrets/toggl_api_token
    secrets:
      - forgejo_token
      - toggl_api_token
    volumes:
      - state:/data
    # Least-privilege runtime flags. The app never binds a port, listens,
    # or needs any Linux capability, and the only path it ever writes is
    # /data (already its own volume) — read_only needs no extra tmpfs.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 128m
    cpus: 0.5

volumes:
  state:

secrets:
  forgejo_token:
    file: ./secrets/forgejo_token
  toggl_api_token:
    file: ./secrets/toggl_api_token
