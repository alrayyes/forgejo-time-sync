# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.
#
# Every Go/golangci-lint command runs through Docker, pinned to the same
# image golangci-lint-action/setup-go use in CI (rules/go.md, rules/
# go-lint.md) — a host `go`/`golangci-lint` install drifting from what CI
# runs is a real failure mode, not just a hypothetical one, and this is how
# it's avoided rather than just hoped against. test-e2e is the one
# exception: it needs the host Docker daemon directly (testcontainers-go
# boots real Forgejo/Prism containers), and wrapping that in a container of
# its own would mean mounting the host's Docker socket with a group GID that
# isn't portable across machines — not worth it for a hook that already runs
# the same command CI does, on CI's own pinned toolchain.

pre-commit:
  jobs:
    - name: golangci-lint fmt
      glob: "*.go"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOLANGCI_LINT_CACHE=/cache -v "$HOME/.cache/golangci-lint-docker:/cache"
        golangci/golangci-lint:v2.13.2 golangci-lint fmt {staged_files}
      stage_fixed: true

    - name: golangci-lint run
      glob: "*.go"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOLANGCI_LINT_CACHE=/cache -v "$HOME/.cache/golangci-lint-docker:/cache"
        golangci/golangci-lint:v2.13.2 golangci-lint run ./...

    # A built-in `go` subcommand, not a third-party tool: gofmt/gofumpt never
    # touch go.mod, and `go mod tidy` does network resolution a
    # formatting-only hook shouldn't be doing.
    - name: go.mod
      glob: "go.mod"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm go mod edit -fmt go.mod
      stage_fixed: true

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes. A hook rewriting files under a push leaves the
# pushed commit and the working tree disagreeing about what was reviewed.
pre-push:
  parallel: true
  jobs:
    - name: test
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm go test -race ./...

    # Not containerized — needs the host Docker daemon directly for
    # testcontainers-go. See the file-level comment above.
    - name: test-e2e
      run: go test -tags e2e ./e2e/...

    - name: hadolint
      glob: "Dockerfile"
      run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

    - name: govulncheck
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

    - name: go.mod
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm go mod edit -fmt go.mod
        && git diff --exit-code go.mod

    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md

    - name: sort-package-json
      run: bun run lint:package-json
