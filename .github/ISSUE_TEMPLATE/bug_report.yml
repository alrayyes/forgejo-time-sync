name: Bug report
description: Something isn't working as expected
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
