name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
    steps:
      # main is protected and GITHUB_TOKEN pushes as github-actions[bot],
      # which has no bypass on a personal (non-org) repo — only the repo
      # admin does. RELEASE_TOKEN is a fine-grained PAT scoped to this repo
      # (Contents: read/write) belonging to the repo owner, so this push
      # clears the required-pull-request check the same way a manual push
      # from that account would.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: "25.0.9"
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # A tag release-please/semantic-release pushes with the default
  # GITHUB_TOKEN starts no further workflow, so this stays a job in the
  # same run rather than its own on-tag workflow — that would silently
  # never fire.
  publish-image:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/${{ github.repository }}
          version=${{ needs.release.outputs.version }}
          docker build -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"
