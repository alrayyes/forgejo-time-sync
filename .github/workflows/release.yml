# release-please decides the version. It keeps a release pull request open
# with the next version and the changelog entry, and merging that pull request
# tags vX.Y.Z and writes the GitHub release. The same run then publishes the
# image, which is the release artifact.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never two releases at once, and never cancel one halfway: a killed run can
# leave a tag with no image against it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # RELEASE_TOKEN, not GITHUB_TOKEN: a pull request opened with the latter
      # gets no checks, so branch protection would never let it merge.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please doesn't push when the release notes are unchanged, and
      # main requires up-to-date branches, so its pull request can sit behind
      # a chore:, ci: or docs: commit. RELEASE_TOKEN again, so the checks run
      # on the new head.
      - name: Bring the open release pull request up to date
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list --base main --label 'autorelease: pending' \
            --json number,headRefName,isCrossRepository --jq '.[]
              | select(.isCrossRepository | not)
              | select(.headRefName | startswith("release-please--"))
              | "\(.number) \(.headRefName)"')
          while read -r number head; do
            [ -n "$number" ] || continue
            behind=$(gh api "repos/$GH_REPO/compare/main...$head" --jq .behind_by)
            if [ "$behind" -gt 0 ]; then
              gh pr update-branch "$number"
            fi
          done <<<"$prs"

  # A job in this run rather than an on-tag workflow, so it doesn't depend on
  # which token pushed the tag.
  publish-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/${{ github.repository }}
          version=${{ needs.release-please.outputs.version }}
          docker build -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"
      - id: digest
        run: |
          image=ghcr.io/${{ github.repository }}
          version=${{ needs.release-please.outputs.version }}
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$version" | cut -d'@' -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # SLSA Build L2: a signed attestation tying the image to the workflow
      # run that built it (rules/releases.md). push-to-registry attaches it
      # to the image itself, alongside the GitHub attestations API.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
