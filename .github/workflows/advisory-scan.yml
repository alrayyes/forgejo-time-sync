# The scan half of rules/dependencies.md: audit main and keep one open "Dependency advisories"
# issue that lists what's there. Daily for advisories published against pins that haven't moved,
# on a Go or lockfile push so a merged fix closes the ticket at once, and by hand. An audit that
# errors (registry down) fails the job and leaves the ticket alone.
name: advisory-scan

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - package.json
      - bun.lock
      - .github/workflows/advisory-scan.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # One ticket for both lockfiles: the audit passes only when both are clean.
      - uses: alrayyes/advisory-scan@c9f794de4354b870e159510f036779baf20f4a2f # v0.3.1
        with:
          mode: scan
          command: |
            # One tool that errors without naming an advisory (registry down) must not be hidden
            # by another tool's advisory IDs, or the ticket would list half the picture. So
            # buffer each tool and print nothing, IDs included, if any tool failed blind.
            # advisory-scan#8 (multi-command support in the action) will replace this wrapper.
            ids='GO-[0-9]{4}-[0-9]+|GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}'
            status=0
            blind=0
            report=''
            run_tool() {
              rc=0
              out=$("$@" 2>&1) || rc=$?
              if [ "${rc}" -ne 0 ]; then
                status=1
                if ! printf '%s\n' "${out}" | grep -Eiq "${ids}"; then
                  blind=1
                  echo "$1 failed without naming an advisory" >&2
                fi
              fi
              report="${report}${out}"$'\n'
            }
            run_tool go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
            run_tool bun audit
            if [ "${blind}" -eq 0 ]; then
              printf '%s' "${report}"
            fi
            exit "${status}"
          timeout-seconds: 600
          labels: dependencies
