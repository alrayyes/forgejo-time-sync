name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - run: go build ./...
      # gotestsum wraps go test for the JUnit report Test Analytics needs,
      # on top of the same human-readable output go test already gave.
      - run: >-
          go tool gotestsum --junitfile junit.xml --
          -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Build the coverage reports
        # Cobertura XML for tools that read it, and the HTML view for a
        # person. Runs on pull requests too, so a broken conversion fails
        # before the merge.
        run: |
          go tool gocover-cobertura < coverage.out > coverage.xml
          go tool cover -html=coverage.out -o coverage.html
      - name: Keep the reports for pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-reports
          path: |
            junit.xml
            coverage.out
            coverage.xml
            coverage.html
          if-no-files-found: error
          retention-days: 1
      # Dependabot-triggered runs pull secrets from GitHub's separate
      # Dependabot secret store, not repo Actions secrets — CODECOV_TOKEN is
      # never there, and none of these bumps touch coverage anyway.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: github.actor != 'dependabot[bot]'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: true
      # Boots real Forgejo + Prism mock containers — see e2e/e2e_test.go.
      # GitHub-hosted runners have a Docker daemon available.
      - run: go test -tags e2e ./e2e/...

  # Assembles the site the reports are published from, on every run. A pull
  # request builds it too, so a broken staging step fails before the merge;
  # only a push to main uploads it as the Pages artifact. No `environment:`
  # here: the github-pages environment is limited to main.
  assemble-reports:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-reports
          path: _go-reports
      - name: Stage the site
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p site/reports/tests site/reports/coverage
          cp _go-reports/junit.xml site/reports/tests/junit.xml
          cp _go-reports/coverage.html site/reports/coverage/index.html
          cp _go-reports/coverage.xml _go-reports/coverage.out site/reports/coverage/
          cat > site/reports/index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>forgejo-time-sync reports</title>
            </head>
            <body>
              <main>
                <h1>forgejo-time-sync reports</h1>
                <p>
                  Commit
                  <a href="https://github.com/alrayyes/forgejo-time-sync/commit/${SHA}"><code>${SHA:0:7}</code></a>,
                  published $(date -u +%Y-%m-%d) (UTC).
                </p>
                <ul>
                  <li><a href="tests/junit.xml">Test results (JUnit XML)</a></li>
                  <li><a href="coverage/">Coverage (HTML)</a></li>
                  <li><a href="coverage/coverage.xml">Coverage (Cobertura XML)</a></li>
                  <li><a href="coverage/coverage.out">Coverage (native profile)</a></li>
                </ul>
              </main>
            </body>
          </html>
          HTML
      - name: Upload the site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Deploys the assembled site to GitHub Pages, on a push to main only. A
  # deploy replaces the whole site, so every other job has to have passed: a
  # red run publishes nothing and the last green set stays up.
  pages:
    needs: [test, lint, docker, docs, assemble-reports]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check the published reports are live
        # The deploy succeeds whether or not the URL answers, so fetch the
        # real files. The retries cover the CDN catching up.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml \
            "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output junit.xml \
            "${PAGE_URL%/}/reports/tests/junit.xml"
          grep -q '<testsuite' junit.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile
      - run: docker build .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint:md
      - run: bun run lint:package-json
      # braces has no patched release (#80); dev tooling only, not in the image.
      - run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm
