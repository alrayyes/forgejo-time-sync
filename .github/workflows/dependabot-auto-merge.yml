# Dependabot has no built-in `automerge: true` the way Renovate does. This is
# that mechanism for a GitHub-primary repo: gate on the pull request's author,
# then arm auto-merge, which waits for the same checks as any other pull
# request.
#
# RELEASE_TOKEN, not GITHUB_TOKEN: a GITHUB_TOKEN merge starts no further
# workflow, so neither CI nor Release would run on main and the bump would
# never ship.
#
# pull_request_target, not pull_request: a pull_request run opened by
# Dependabot can't read Actions secrets. Nothing here checks out or runs the
# pull request's code, and the head must be a branch of this repo. Don't copy
# the token into the Dependabot secret store instead; rotation would miss it.
name: dependabot-auto-merge

on: pull_request_target

# The one step uses RELEASE_TOKEN, so the default token needs nothing.
permissions: {}

# Keyed on the number: github.ref is the base branch under this trigger.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Every update type, majors included: the same required checks gate
      # them as any other pull request, so a red major simply never merges.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
