[project]
name = "forgejo-time-sync"
version = "0.1.0"
description = "Pulls time entries off Forgejo issues and pushes them into Kimai."
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "testcontainers==4.15.0", "ruff==0.16.3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["test"]
